<main id="main-content">

  <h1>Contact</h1>
  <p>The fastest way to reach me is by email at <a href="mailto:jasbanks@umich.edu">jasbanks@umich.edu</a>. You may also use the form below.</p>

  <form id="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST" novalidate>
    <div class="form-field">
      <label for="first_name">First name <span class="required-mark" aria-hidden="true">*</span></label>
      <input type="text" id="first_name" name="first_name" required autocomplete="given-name">
    </div>

    <div class="form-field">
      <label for="last_name">Last name</label>
      <input type="text" id="last_name" name="last_name" autocomplete="family-name">
    </div>

    <div class="form-field">
      <label for="email">Email <span class="required-mark" aria-hidden="true">*</span></label>
      <input type="email" id="email" name="_replyto" required autocomplete="email">
    </div>

    <div class="form-field">
      <label for="message">Message <span class="required-mark" aria-hidden="true">*</span></label>
      <textarea id="message" name="message" required></textarea>
    </div>

    <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
    <input type="hidden" name="_subject" value="New message from jasbanks.com">

    <button type="submit" class="btn btn-primary" id="submit-btn">Submit</button>
    <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
  </form>
